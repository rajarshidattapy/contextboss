name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "packages/contextboss-core[dev]" -e "packages/contextboss-mcp[dev]" -e "packages/contextboss-api[dev]"
      - run: ruff check packages
      - run: python -m mypy packages/contextboss-core/src/contextboss
      - run: python -m pytest packages/contextboss-core packages/contextboss-mcp packages/contextboss-api bench -q
      - name: reproducible build + wheel smoke test
        run: |
          python -m build packages/contextboss-core
          python -m build packages/contextboss-mcp
          pip install --force-reinstall --no-deps packages/contextboss-core/dist/*.whl
          python -c "import contextboss; print(contextboss.__version__)"
