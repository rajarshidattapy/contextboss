[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextboss-api"
version = "0.2.0"
description = "Versioned REST API for ContextBoss: remote context CRUD, assembly and sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["contextboss-core", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
contextboss-api = "contextboss_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
