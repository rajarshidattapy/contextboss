[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextboss-core"
version = "0.2.0"
description = "Master the context window, don't fight it. Persistent context storage, dynamic token budgeting, priority-based assembly, memory + retrieval + tool allocation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["tiktoken>=0.5", "pydantic-settings>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "build"]

[project.scripts]
contextboss = "contextboss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
